[project]
name = "aurora"
version = "0.1.0"
description = "Aurora v2 MVP: Fact-Intent blackboard, Kali-first worker tooling, and debug traces."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=44.0.0",
  "fastapi>=0.115.0",
  "playwright>=1.50.0",
  "python-multipart>=0.0.20",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
