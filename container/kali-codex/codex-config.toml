[[skills.config]]
path = "/opt/aurora-skills"
enabled = true

[mcp_servers.aurora_reverse]
command = "/opt/aurora-venv/bin/python"
args = ["/opt/aurora-mcp/reverse_server.py"]
startup_timeout_sec = 20
tool_timeout_sec = 300

[mcp_servers.aurora_reverse.env]
AURORA_MCP_EVENT_LOG = "/workspace/runtime/mcp-events.jsonl"

[mcp_servers.aurora_debug]
command = "/opt/aurora-venv/bin/python"
args = ["/opt/aurora-mcp/debug_server.py"]
startup_timeout_sec = 20
tool_timeout_sec = 120

[mcp_servers.aurora_debug.env]
AURORA_MCP_EVENT_LOG = "/workspace/runtime/mcp-events.jsonl"

[mcp_servers.aurora_blackboard]
command = "/opt/aurora-venv/bin/python"
args = ["/opt/aurora-mcp/blackboard_server.py"]
startup_timeout_sec = 20
tool_timeout_sec = 30
env_vars = [
    "AURORA_WORKER_CONTROL_BASE_URL",
    "AURORA_WORKER_ID",
    "AURORA_WORKER_CONTROL_TOKEN",
    "AURORA_WORKER_CONTROL_TIMEOUT_SECONDS",
    "AURORA_WORKER_CONTROL_MAX_ATTEMPTS",
]

[mcp_servers.aurora_blackboard.env]
AURORA_MCP_EVENT_LOG = "/workspace/runtime/mcp-events.jsonl"
